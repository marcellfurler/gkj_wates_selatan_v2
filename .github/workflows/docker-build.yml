name: Build Docker Images

on:
  push:
    branches:
      - master

jobs:

  backend:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./gkj_wates_selatan_backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gkj-backend:latest

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./gkj_wates_selatan_frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=/backend
          tags: ghcr.io/${{ github.repository_owner }}/gkj-frontend:latest