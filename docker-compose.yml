version: "3.9"

services:

  mariadb:
    image: mariadb:11

    container_name: gkj-mariadb

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: gkjwasel@ukdw2565
      MYSQL_DATABASE: gkj_wates_selatan_v3

    volumes:
      - mariadb_data:/var/lib/mysql

    ports:
      - "3306:3306"

  backend:
    build:
      context: ./gkj_wates_selatan_backend

    container_name: gkj-backend

    restart: unless-stopped

    env_file:
      - ./gkj_wates_selatan_backend/.env

    ports:
      - "5000:5000"

    depends_on:
      - mariadb

  frontend:
    build:
      context: ./gkj_wates_selatan_frontend

    container_name: gkj-frontend

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend

volumes:
  mariadb_data: